<style data-page-node-id="baKRxTbQLsgCLXK9gFvVnP" data-pnid-children="EJjolsyyU99Bqdr4S8Audt">
:root{
  --blue:#007AFF; --bg:#FFFFFF; --group:#F2F2F7; --card:#FFFFFF;
  --label:#1C1C1E; --label2:#8E8E93; --label3:#C7C7CC;
  --sep:rgba(60,60,67,.12); --fill:rgba(118,118,128,.12);
  --hl:#007AFF; --radius:18px;
  --safe-b:env(safe-area-inset-bottom,0px);
  --safe-t:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Helvetica Neue",Arial,sans-serif;
  background:var(--group); color:var(--label);
  font-size:15px; line-height:1.45;
  -webkit-font-smoothing:antialiased;
  overscroll-behavior:none;
}
button{font-family:inherit;font-size:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input{font-family:inherit;font-size:inherit}

/* ---------- 布局 ---------- */
.view{position:fixed;inset:0;display:none;flex-direction:column;background:var(--group)}
.view.on{display:flex}
.nav{
  height:44px;flex:0 0 auto;display:flex;align-items:center;
  padding:0 12px;padding-top:var(--safe-t);box-sizing:content-box;
  background:rgba(242,242,247,.86);backdrop-filter:saturate(180%) blur(20px);
  -webkit-backdrop-filter:saturate(180%) blur(20px);
  border-bottom:.5px solid var(--sep);
  position:relative;z-index:10;
}
.nav .t{position:absolute;left:0;right:0;text-align:center;font-size:17px;font-weight:600;pointer-events:none}
.nav .l,.nav .r{font-size:17px;color:var(--blue);position:relative;z-index:2;padding:6px 4px}
.nav .r{margin-left:auto}
.nav .ic{font-size:20px;line-height:1;color:var(--blue)}
.body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:24px}
.body::-webkit-scrollbar,.cues::-webkit-scrollbar{width:0;height:0;display:none}
.body,.cues{scrollbar-width:none}

/* ---------- 首页 ---------- */
.hero{padding:32px 20px 8px}
.hero h1{margin:0 0 7px;font-size:34px;line-height:1.15;font-weight:700;letter-spacing:-.6px}
.hero p{margin:0;color:var(--label2);font-size:14px;line-height:1.5}
.sec{font-size:13px;font-weight:500;color:var(--label2);text-transform:none;padding:24px 20px 8px}
.card{background:var(--card);border-radius:var(--radius);margin:0 16px;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:15px 16px;position:relative;min-height:60px}
.row+.row::before{content:"";position:absolute;left:16px;right:0;top:0;height:.5px;background:var(--sep)}
.row:active{background:var(--fill)}
.row .main{flex:1;min-width:0}
.row .ti{font-size:16px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .su{font-size:13px;color:var(--label2);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .chev{color:var(--label3);font-size:15px;font-weight:600}
.badge{font-size:11px;font-weight:600;color:var(--blue);background:rgba(0,122,255,.1);padding:2px 7px;border-radius:20px}
.empty{text-align:center;padding:56px 32px;color:var(--label2)}
.empty .big{font-size:32px;opacity:.2;margin-bottom:12px}
.empty h3{margin:0 0 8px;font-size:17px;color:var(--label);font-weight:600}
.empty p{margin:0;font-size:14px;line-height:1.6}
.addbtn{
  display:flex;align-items:center;justify-content:center;gap:7px;
  width:calc(100% - 32px);height:50px;border-radius:14px;background:var(--blue);color:var(--bg);
  font-size:16px;font-weight:600;margin:16px;
}
.addbtn:active{opacity:.72}

/* ---------- 播放页 ---------- */
.pnav{height:44px;display:flex;align-items:center;padding:0 13px;padding-top:var(--safe-t);
  background:rgba(255,255,255,.9);backdrop-filter:blur(20px);border-bottom:.5px solid var(--sep);flex:0 0 auto;z-index:10}
.pnav .back{color:var(--blue);font-size:16px;display:flex;align-items:center;gap:1px}
.pnav .mid{flex:1;text-align:center;font-size:15px;font-weight:600;padding:0 8px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pnav .act{color:var(--blue);font-size:16px}

/* 显示模式分段控件 */
.seg{display:flex;background:var(--fill);border-radius:9px;padding:2px;margin:10px 16px 0;flex:0 0 auto}
.seg button{flex:1;padding:6px 0;font-size:13px;font-weight:500;border-radius:7px;color:var(--label);transition:background .18s}
.seg button.sel{background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.12);font-weight:600}

/* 字幕区 */
.cues{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px 16px 8px;scroll-behavior:smooth}
.cue{padding:11px 14px;border-radius:12px;margin-bottom:3px;transition:background .22s,color .22s;position:relative}
.cue .en{font-size:16px;line-height:1.5;color:var(--label);transition:color .22s}
.cue .zh{font-size:14px;line-height:1.5;color:var(--label2);margin-top:3px;transition:color .22s}
.cue.active{background:#fff;box-shadow:0 2px 12px rgba(0,0,0,.07)}
.cue.active::before{content:"";position:absolute;left:0;top:12px;bottom:12px;width:3px;border-radius:2px;background:var(--hl)}
.cue.active .en{font-weight:600;color:var(--label)}
.cue.active .zh{color:#3C3C43}
.cue.past .en{color:var(--label2)}
.cue.past .zh{color:var(--label3)}

/* 显示模式 */
.cues[data-mode="en"] .zh{display:none}
.cues[data-mode="zh"] .en{display:none}
/* 纯中文模式但没译文时，用浅色英文兜底，别留空白 */
.cues[data-mode="zh"] .cue.nozh .en{display:block;color:var(--label2);font-weight:400}
.cues[data-mode="en"] .cue.active::before,
.cues[data-mode="zh"] .cue.active::before{background:var(--hl)}

/* 底部控制 */
.ctrl{flex:0 0 auto;background:rgba(255,255,255,.94);backdrop-filter:blur(20px);
  border-top:.5px solid var(--sep);padding:8px 16px calc(10px + var(--safe-b))}
.bar{display:flex;align-items:center;gap:10px;font-variant-numeric:tabular-nums}
.bar .tm{font-size:11px;color:var(--label2);width:38px;flex:0 0 auto;text-align:center}
.bar input[type=range]{flex:1;-webkit-appearance:none;height:4px;border-radius:2px;background:var(--label3);outline:none}
.bar input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:13px;height:13px;border-radius:50%;background:#fff;
  box-shadow:0 1px 4px rgba(0,0,0,.3)}
.btns{display:flex;align-items:center;justify-content:space-between;margin-top:6px}
.btns .g{display:flex;align-items:center;gap:26px}
.ib{width:44px;height:44px;display:flex;align-items:center;justify-content:center;border-radius:50%;color:var(--label)}
.ib svg{width:26px;height:26px;fill:currentColor}
.ib.play{width:56px;height:56px;background:var(--blue);color:#fff;box-shadow:0 3px 12px rgba(0,122,255,.32)}
.ib.play svg{width:26px;height:26px}
.ib.on{color:var(--blue)}
.spd{font-size:13px;font-weight:600;color:var(--label2);width:44px;text-align:center;
  height:44px;display:flex;align-items:center;justify-content:center}
.spd.on{color:var(--blue)}

/* ---------- 设置 ---------- */
.grp{background:#fff;border-radius:var(--radius);margin:0 16px;overflow:hidden}
.fld{padding:12px 16px;position:relative}
.fld+.fld::before{content:"";position:absolute;left:16px;right:0;top:0;height:.5px;background:var(--sep)}
.fld label{display:block;font-size:13px;color:var(--label2);margin-bottom:5px}
.fld input{width:100%;border:0;outline:0;background:var(--fill);border-radius:9px;padding:10px 12px;font-size:15px}
.fld input::placeholder{color:var(--label3)}
.note{font-size:12.5px;color:var(--label2);line-height:1.55;padding:8px 22px 0}
.pill{display:inline-block;font-size:12px;padding:3px 9px;border-radius:20px;background:rgba(0,122,255,.1);color:var(--blue);font-weight:500}

/* 弹层 */
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.32);display:none;align-items:flex-end;z-index:100}
.sheet.on{display:flex}
.sheet .panel{background:#fff;width:100%;border-radius:20px 20px 0 0;padding:8px 0 calc(12px + var(--safe-b));
  animation:up .26s cubic-bezier(.2,.8,.2,1)}
@keyframes up{from{transform:translateY(100%)}to{transform:translateY(0)}}
.sheet .hd{display:flex;align-items:center;padding:8px 20px 4px}
.sheet .hd .x{font-size:15px;color:var(--label2)}
.sheet .hd .ok{margin-left:auto;font-size:15px;font-weight:600;color:var(--blue)}
.sheet .st{text-align:center;font-size:13px;color:var(--label2);padding:12px 0}
.opt{display:flex;align-items:center;padding:15px 20px;font-size:16px;position:relative}
.opt+.opt::before{content:"";position:absolute;left:20px;right:0;top:0;height:.5px;background:var(--sep)}
.opt .ck{margin-left:auto;color:var(--blue);font-weight:600;opacity:0}
.opt.sel .ck{opacity:1}

.toast{position:fixed;left:50%;bottom:88px;transform:translate(-50%,14px);background:rgba(28,28,30,.92);
  color:#fff;font-size:13.5px;padding:9px 16px;border-radius:20px;opacity:0;transition:.25s;z-index:200;
  pointer-events:none;max-width:80vw;text-align:center;line-height:1.4}
.toast.on{opacity:1;transform:translate(-50%,0)}
.prog{height:2px;background:var(--fill);border-radius:2px;overflow:hidden;margin:6px 16px 0;display:none}
.prog.on{display:block}
.prog i{display:block;height:100%;width:0;background:var(--blue);transition:width .3s}

/* 全局深色界面：复用既有颜色 token，不修改 :root */
body,.view{background:var(--label);color:var(--bg)}
.nav{background:var(--label);border-color:var(--label2);backdrop-filter:none}
.card,.grp,.sheet .panel{background:var(--fill);color:var(--bg)}
.sheet .panel{background:var(--label)}
.row+.row::before,.fld+.fld::before,.opt+.opt::before{background:var(--label2)}
.row:active{background:var(--fill)}
.empty h3{color:var(--bg)}
.fld input{color:var(--bg)}
.sheet .st,.note,.row .su,.sec{color:var(--label2)}

/* 播放页：深色阅读界面，沿用现有设计色值 */
#vPlay{background:var(--label);color:var(--bg)}
#vPlay .pnav{background:var(--label);border-color:var(--label2);backdrop-filter:none}
#vPlay .pnav .mid{color:var(--bg);font-size:16px}
#vPlay .pnav .back,#vPlay .pnav .act{color:var(--blue)}
#vPlay .seg{background:var(--label);border-bottom:.5px solid var(--label2);border-radius:0;margin:0 16px;padding:8px 0 0}
#vPlay .seg button{color:var(--label2);border-radius:0;padding:10px 0 12px;box-shadow:none}
#vPlay .seg button.sel{background:none;color:var(--bg);box-shadow:inset 0 -2px var(--blue)}
#vPlay .cues{padding:22px 20px 18px}
#vPlay .reading-head{padding:6px 0 18px}
#vPlay .reading-head h1{font-size:28px;line-height:1.25;letter-spacing:-.4px;margin:0 0 12px;overflow-wrap:anywhere}
#vPlay .reading-head p{font-size:13px;color:var(--label2);margin:0}
#vPlay .cue{padding:8px 0 9px;border-radius:0;margin-bottom:5px}
#vPlay .cue .en{font-family:Georgia,"Times New Roman",serif;font-size:var(--fs,16px);line-height:1.55;color:var(--bg)}
#vPlay .cue .en .word.now{text-decoration:underline;text-decoration-color:var(--blue);text-decoration-thickness:2px;text-underline-offset:5px}
#vPlay .cue .en .word{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.word-action{display:block;color:var(--blue);text-decoration:none}
.word-action:active{opacity:.7}
#vPlay .cue .zh{font-size:15px;line-height:1.6;color:var(--label2);margin-top:5px}
#vPlay .cue.active{background:none;box-shadow:none}
#vPlay .cue.active::before{left:-12px;top:8px;bottom:8px;background:var(--blue)}
#vPlay .cue.active .en{color:var(--bg);font-weight:600}
#vPlay .cue.active .zh{color:var(--label3)}
#vPlay .cue.past .en{color:var(--label3)}
#vPlay .cue.past .zh{color:var(--label2)}
/* 中文单语阅读：沿用用户正文字号设置并适度放大。 */
#vPlay .cues[data-mode="zh"] .cue .zh{font-size:calc(var(--fs,16px) + 4px);line-height:1.65;margin-top:0}
#vPlay .cues[data-mode="zh"] .cue.active .zh{color:var(--bg);font-weight:600}
#vPlay .cues[data-mode="zh"] .cue.nozh .en{color:var(--label2)}
#vPlay .empty h3{color:var(--bg)}
#vPlay .ctrl{background:var(--label);border-color:var(--label2);backdrop-filter:none;padding:12px 20px calc(12px + var(--safe-b))}
#vPlay .bar .tm{color:var(--label3);font-size:12px;font-weight:500;letter-spacing:.1px}
#vPlay .bar input[type=range]{background:var(--label2)}
#vPlay .bar input[type=range]::-webkit-slider-thumb{background:var(--blue);box-shadow:none}
#vPlay .btns{margin-top:10px}
#vPlay .ib{color:var(--bg)}
#vPlay .ib.play{background:none;color:var(--bg);box-shadow:none}
#vPlay .ib.play svg{width:32px;height:32px}
#vPlay .ib.on,#vPlay .spd.on{color:var(--blue)}
#vPlay .spd{color:var(--label3)}
#vPlay .tools{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px;margin-bottom:6px}
#vPlay .tool{display:flex;flex-direction:column;align-items:center;gap:0;color:var(--label3);font-size:12px}
#vPlay .tool .ib,#vPlay .tool .spd{width:38px;height:38px}
#vPlay .btns{justify-content:space-around}
#vPlay .follow{position:absolute;right:16px;bottom:calc(184px + var(--safe-b));z-index:5;background:var(--blue);color:var(--bg);border-radius:20px;padding:8px 12px;font-size:13px}
#vPlay .follow[hidden]{display:none}
.jump-search{padding:4px 20px 10px}
.jump-search input{width:100%;border:0;outline:0;border-radius:9px;background:var(--fill);color:var(--bg);padding:11px 12px;font-size:16px}
.jump-list{max-height:48vh;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.jump-list .opt{width:100%;text-align:left;gap:12px;color:var(--bg)}
.jump-list .main{min-width:0;flex:1}
.jump-list .jump-text{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.jump-list .jump-meta{color:var(--label2);font-size:12px;margin-top:3px}
.jump-list .jump-current{color:var(--blue)}

/* 触屏和小屏：保留安全区，扩大控件触摸范围。 */
.view,.body,.cues{min-height:0;min-width:0}
.body,.cues{overscroll-behavior:contain}
.sheet .panel{max-height:80vh;max-height:80dvh;overflow-y:auto;-webkit-overflow-scrolling:touch}
.fld input{font-size:16px}
#vPlay .pnav{box-sizing:content-box}
#vPlay .pnav .mid{min-width:0}
#vPlay .cues{overflow-wrap:anywhere;touch-action:pan-y}
#vPlay .tool .ib,#vPlay .tool .spd{width:44px;height:44px}
#vPlay .bar input[type=range]{min-width:0;height:28px;background:transparent}
#vPlay .bar input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:999px;background:linear-gradient(to right,var(--blue) 0%,var(--blue) var(--played,0%),rgba(142,142,147,.48) var(--played,0%),rgba(142,142,147,.48) 100%)}
#vPlay .bar input[type=range]::-webkit-slider-thumb{width:16px;height:16px;margin-top:-6px;background:var(--bg);box-shadow:0 1px 4px rgba(0,0,0,.24)}
#vPlay .bar input[type=range]::-moz-range-track{height:4px;border-radius:999px;background:rgba(142,142,147,.48)}
#vPlay .bar input[type=range]::-moz-range-progress{height:4px;border-radius:999px;background:var(--blue)}
#vPlay .bar input[type=range]::-moz-range-thumb{width:16px;height:16px;border:0;border-radius:50%;background:var(--bg);box-shadow:0 1px 4px rgba(0,0,0,.24)}
@media (max-width:380px){
  #vPlay .cues{padding-left:16px;padding-right:16px}
  #vPlay .ctrl{padding-left:14px;padding-right:14px}
  #vPlay .tools{gap:2px}
  #vPlay .reading-head h1{font-size:25px}
}
@media (max-height:600px){
  #vPlay .cues{padding-top:12px}
  #vPlay .reading-head{padding-bottom:8px}
  #vPlay .cue{margin-bottom:4px;padding-top:7px;padding-bottom:8px}
  #vPlay .ctrl{padding-top:5px}
  #vPlay .tools{margin-bottom:2px}
  #vPlay .btns{margin-top:2px}
}
/* 阅读与播放控制：保持深色界面与既有设计色。 */
#vPlay .cues{padding-top:16px;padding-bottom:14px}
#vPlay .reading-head{padding:2px 0 13px}
#vPlay .reading-head h1{font-size:22px;line-height:1.3;letter-spacing:-.3px;margin:0 0 6px}
#vPlay .reading-head p{font-size:12px}
#vPlay .cues[data-mode="zh"] .cue{padding:6px 0 7px;margin-bottom:2px}
#vPlay .cues[data-mode="zh"] .cue .zh{line-height:1.55}
#vPlay .cues[data-mode="zh"] .cue.active::before{top:10px;bottom:auto;height:1.2em;max-height:calc(100% - 20px);width:3px;border-radius:3px}
#vPlay .ctrl{border-color:rgba(142,142,147,.28);padding:8px 20px calc(8px + var(--safe-b))}
#vPlay .tools{gap:4px;margin-bottom:5px}
#vPlay .tool{gap:1px;font-size:11px;line-height:1.3;font-weight:500}
#vPlay .tool .ib,#vPlay .tool .spd{width:44px;height:44px}
#vPlay .tool .ib svg,#vPlay .tool .tool-icon svg{width:22px;height:22px}
#vPlay .tool .tool-icon svg{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#vPlay .tool:has(button.on)>span{color:var(--blue)}
#vPlay .bar{gap:8px;margin-top:3px}
#vPlay .bar .tm{width:38px;font-size:11px;color:var(--label3)}
#vPlay .btns{margin-top:3px;justify-content:space-evenly}
#vPlay .btns .ib svg{width:24px;height:24px}
#vPlay .btns .ib.play svg{width:30px;height:30px}
#vPlay .follow{display:block;right:18px;bottom:calc(var(--control-height, 184px) + 8px);min-height:44px;padding:0 13px;border-radius:22px;font-size:12px;font-weight:600;box-shadow:0 3px 12px rgba(0,0,0,.18);opacity:1;visibility:visible;transform:translateY(0);transition:opacity .18s ease,transform .18s ease,visibility 0s}
#vPlay .follow[hidden]{display:block;opacity:0;visibility:hidden;pointer-events:none;transform:translateY(5px);transition:opacity .18s ease,transform .18s ease,visibility 0s .18s}
@media (max-width:380px){#vPlay .reading-head h1{font-size:20px}#vPlay .ctrl{padding-left:14px;padding-right:14px}}
@media (max-height:600px){#vPlay .reading-head{padding-bottom:8px}#vPlay .ctrl{padding-top:4px}}

.sleep-custom{padding:16px 20px 18px;color:var(--bg)}
.sleep-custom label{display:block;font-size:13px;color:var(--label3);margin-bottom:8px}
.sleep-custom-row{display:flex;align-items:stretch;gap:10px}
.sleep-custom-row input{min-width:0;flex:1;border:0;outline:0;border-radius:10px;padding:10px 12px;background:rgba(142,142,147,.18);color:var(--bg);font-size:16px}
.sleep-custom-row button{min-height:44px;padding:0 16px;border-radius:10px;background:var(--blue);color:var(--bg);font-size:14px;font-weight:600}
.sleep-error{min-height:18px;margin-top:5px;color:#FF9F9F;font-size:12px}
/* 轻量触感反馈；尊重系统减少动态效果的设置。 */
#vPlay .ib,#vPlay .spd{transition:transform .16s ease,opacity .16s ease,color .16s ease}
#vPlay .ib:active,#vPlay .spd:active{transform:scale(.94);opacity:.72}
/* 横屏：保留原播放器与状态，使用双栏展示。 */
@media (orientation:landscape) and (min-width:560px){

    const cmtLen = dv.getUint16(off + 32, true);
    const localOff = dv.getUint32(off + 42, true);
    const name = zipName(u8.subarray(off + 46, off + 46 + nameLen), !!(flag & 0x800));
    off += 46 + nameLen + extraLen + cmtLen;
    if (/\/$/.test(name)) continue;
    const base = name.split("/").pop();
    if (!base || base.startsWith(".") || /^__MACOSX/.test(name)) continue;
    const item = { name, size: compSize, method, localOff };
    item.get = async () => {
      const lNameLen = dv.getUint16(localOff + 26, true);
      const lExtraLen = dv.getUint16(localOff + 28, true);
      const start = localOff + 30 + lNameLen + lExtraLen;
      const comp = u8.subarray(start, start + compSize);
      if (method === 0) return comp;
      if (method === 8) return inflateRaw(comp);
      throw new Error("不支持的压缩方式");
    };
    out.push(item);
  }
  return out;
}

/* ---------- 配对：音频名 ↔ 字幕名 ---------- */
function pairUp(items, subs) {
  const pairs = [];
  const used = new Set();
  const take = (it, s) => { if (used.has(s)) return false; used.add(s); pairs.push([it, s]); return true; };
  // 1. 完全同名
  items.forEach(it => {
    const k = normKey(it.name);
    const s = subs.find(x => !used.has(x) && normKey(x.name) === k);
    if (s) take(it, s);
  });
  // 2. 去掉分P编号后同名
  items.forEach(it => {
    if (pairs.some(p => p[0] === it)) return;
    const k = normKey2(it.name);
    if (!k) return;
    const s = subs.find(x => !used.has(x) && normKey2(x.name) === k);
    if (s) take(it, s);
  });
  // 3. 互相包含，取最短的作为最佳
  items.forEach(it => {
    if (pairs.some(p => p[0] === it)) return;
    const k = normKey(it.name);
    const cands = subs.filter(x => !used.has(x)).filter(x => {
      const ks = normKey(x.name);
      return ks && (k.includes(ks) || ks.includes(k));
    }).sort((a, b) => normKey(a.name).length - normKey(b.name).length);
    if (cands.length) take(it, cands[0]);
  });
  return pairs;
}

let importReviewResolve=null;
function makeImportPlan(audios,subs,records){
  const existing=new Map(records.map(t=>[normKey(t.name),t]));
  const audioRows=audios.map((file,i)=>({id:'a'+i,name:baseOf(file.name),file,old:existing.get(normKey(file.name))||null,action:existing.has(normKey(file.name))?'skip':'import'}));
  const covered=new Set(audioRows.filter(r=>r.old).map(r=>r.old.id));
  const targets=audioRows.map(r=>({id:r.id,name:r.name,old:r.old})).concat(records.filter(t=>!covered.has(t.id)).map(t=>({id:'t:'+t.id,name:t.name,old:t})));
  const matches=new Map(pairUp(targets,subs).map(([target,file])=>[file,target.id]));
  return {audioRows,targets,subRows:subs.map(file=>({file,target:matches.get(file)||''}))};

async function commitImportPlan(plan){

/* 只读元数据拿时长，导入时就把列表填满 */
function probeDuration(file) {
  return new Promise(res => {
    let u;
    try { u = URL.createObjectURL(file); } catch (e) { res(0); return; }
    const a = new Audio();
    const done = d => { try { URL.revokeObjectURL(u); } catch (e) {} res(d || 0); };
    a.preload = "metadata";
    a.onloadedmetadata = () => done(a.duration);
    a.onerror = () => done(0);
    setTimeout(() => done(a.duration || 0), 4000);
    a.src = u;
  });
}

/* ---------- 拖拽 ---------- */
function readEntry(entry, path, out) {
  return new Promise(res => {
    if (entry.isFile) {
      entry.file(f => { f.__path = path; out.push(f); res(); }, () => res());
    } else if (entry.isDirectory) {
      const rd = entry.createReader();
      const all = [];
      const next = () => rd.readEntries(async es => {
        if (!es.length) { for (const e of all) await readEntry(e, path + entry.name + "/", out); res(); return; }
        all.push(...es); next();
      }, () => res());
      next();
    } else res();
  });
}
let dragDepth = 0;
document.addEventListener("dragenter", e => { e.preventDefault(); dragDepth++; document.body.style.opacity = ".92"; });
document.addEventListener("dragover", e => e.preventDefault());
document.addEventListener("dragleave", e => { if (--dragDepth <= 0) { dragDepth = 0; document.body.style.opacity = ""; } });
document.addEventListener("drop", async e => {
  e.preventDefault(); dragDepth = 0; document.body.style.opacity = "";
  const dt = e.dataTransfer;
  if (!dt) return;
  let files = [...(dt.files || [])];
  // 支持拖文件夹：递归读
  if (dt.items && dt.items.length && dt.items[0].webkitGetAsEntry) {
    const out = [];
    for (const it of dt.items) {
      const en = it.webkitGetAsEntry && it.webkitGetAsEntry();
      if (en && en.isDirectory) await readEntry(en, "", out);
    }
    if (out.length) files = out;
  }
  if (!files.length) return;
  importBatch(files, files.some(f => extOf(f.name) === "zip"));
});

  if(!cue||!el||(isBlind()&&blindRevealedIndex!==curIdx)||mode==='zh'||(practice.active&&(practice.phase==='gap'||practice.phase==='complete'))){clearWordHighlight();return;}
  ensureCueWords(el);
  const timeline=getWordTimeline(cue);let cache=wordTimingCache.get(el);
  if(!cache||cache.timeline!==timeline){cache={timeline,words:[...el.querySelectorAll('.word')]};wordTimingCache.set(el,cache);}
  const index=timelineWordIndex(timeline,time-wordOffset()),next=index<0?null:cache.words[index];
  if(highlightedWord===next&&(!next||next.classList.contains('now')))return;
  clearWordHighlight();if(next){next.classList.add('now');highlightedWord=next;}
}
function wordRenderDelay(time) {
  const cue=cues[curIdx];if(!cue||mode==='zh')return 80;
  const timeline=getWordTimeline(cue),offset=wordOffset(),adjusted=time-offset;
  let next=Infinity;
  for(const array of [timeline.starts,timeline.ends]){
    let lo=0,hi=array.length;
    while(lo<hi){const mid=(lo+hi)>>1;if(array[mid]<=adjusted)lo=mid+1;else hi=mid;}
    if(lo<array.length)next=Math.min(next,array[lo]+offset);
  }
  if(cues[curIdx+1])next=Math.min(next,cues[curIdx+1].s);
  return Math.max(12,Math.min(80,(next-time)/Math.max(.1,audio.playbackRate)*1000));
}

let sheetReturnFocus = null, sheetConfirmResolve = null, sheetFocusFrame = 0;
function sheetFocusables() {
  return [...$("#sheet").querySelectorAll('button:not([disabled]),a[href],input:not([disabled]),select:not([disabled]),[tabindex="0"]')]
    .filter(el => !el.hidden && el.getClientRects().length && getComputedStyle(el).visibility !== "hidden");

function presentSheet(initialFocus) {
  if(importReviewResolve&&!$("#importPreview"))settleImportReview(false);

  if(subtitlePreviewOffset&&!$("#subtitleCalibration"))cancelSubtitlePreview();

  $$(".view").forEach(view => { view.inert = true; view.setAttribute("aria-hidden", "true"); });

function closeSheet(accepted = false) {
  const sheet = $("#sheet");

  cancelAnimationFrame(sheetFocusFrame);
  sheet.classList.remove("on");

  const target = sheetReturnFocus; sheetReturnFocus = null;
  if (target && target.isConnected && target.getClientRects().length) target.focus({ preventScroll:true });
  else if (sheet.contains(document.activeElement)) document.activeElement.blur();
  sheet.setAttribute("aria-hidden", "true");

  const promise = new Promise(resolve => { sheetConfirmResolve = resolve; });
  $("#confirmCancel").onclick = () => closeSheet();

  presentSheet($("#confirmCancel"));

}
document.addEventListener("keydown", e => {
  if (!$("#sheet").classList.contains("on")) return;
  if (e.key === "Escape") { e.preventDefault(); e.stopPropagation(); closeSheet(); }
  else if (e.key === "Tab") {
    const items = sheetFocusables(), first = items[0], last = items[items.length - 1];
    if (!first) { e.preventDefault(); return; }
    if (e.shiftKey && (document.activeElement === first || !items.includes(document.activeElement))) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && (document.activeElement === last || !items.includes(document.activeElement))) { e.preventDefault(); first.focus(); }
  }
});

let translating = false;
async function doTranslate(all) {
  if (translating) { toast("上一项翻译还在结束，请稍后再试"); return; }
  if (!cur || !cues.length) return;
  translating = true;
  const track = cur, sourceCues = cues;
  const isCurrent = () => cur === track && cues === sourceCues && $("#vPlay").classList.contains("on");
  try {
  if (all) { track.tr = {}; track.trCount = 0; await dbPut(track); }
  if (!isCurrent()) return;
  const tr = track.tr || (track.tr = {});
  const todo = [];
  sourceCues.forEach((c, i) => { if (!tr[i] && c.en) todo.push(i); });
  if (!todo.length) { toast("已经全部译好了"); return; }

  const bar = $("#prog"), fill = bar.querySelector("i");
  bar.classList.add("on"); fill.style.width = "0%";
  let done = 0, fail = 0, stopped = false;
  const BATCH = 20;
  toast("翻译中，可以继续滚动看字幕", 2500);

  for (let k = 0; k < todo.length; k += BATCH) {
    if (!isCurrent()) { stopped = true; break; }
    const ids = todo.slice(k, k + BATCH);
    try {
      const map = await callTranslate(ids.map(i => sourceCues[i].en));
      if (!isCurrent()) { stopped = true; break; }
      ids.forEach((idx, j) => {
        const zh = map[j] || map[String(j + 1)] || map[j + 1];
        if (zh) tr[idx] = String(zh).trim();
      });
      done += ids.length;
    } catch (e) {
      if (!isCurrent()) { stopped = true; break; }
      console.error(e); fail += ids.length;
    }
    fill.style.width = Math.round((done + fail) / todo.length * 100) + "%";
    track.tr = tr;
    track.trCount = Object.keys(tr).length;
    applyTr();
    await dbPut(track).catch(() => {});
    if (fail && fail === todo.length) break;
  }
  bar.classList.remove("on");
  track.trCount = Object.keys(tr).length;
  if (!isCurrent()) stopped = true;
  if (stopped) { toast("已停止翻译，已保存的译文会保留"); return; }
  if (fail && done === 0) {
    toast("翻译失败，检查 Key / 地址 / 余额");
  } else if (fail) {
    toast(`完成 ${done} 句，${fail} 句失败，可再点一次重试`);
  } else {
    toast(`已翻译 ${done} 句`);
    setMode("both", true);
    renderLib();
  }
  } finally { translating = false; }
}

/* 调 OpenAI 兼容接口，要求返回 JSON 数组 */
async function callTranslate(texts) {
  const base = cfg.base.replace(/\/+$/, "");
  const url = base + "/chat/completions";
  const prompt = texts.map((t, i) => (i + 1) + ". " + t).join("\n");
  const sys = "你是英语学习助手。把下面编号的英文句子逐条翻译成简体中文，保持编号。"
    + "只输出一个 JSON 数组，不要任何解释、不要 markdown 代码块，格式：[\"译文1\",\"译文2\",...]，顺序与编号一致。";
  const body = {
    model: cfg.model || "deepseek-chat",
    messages: [{ role: "system", content: sys }, { role: "user", content: prompt }],
    temperature: 0.2,
    stream: false
  };
  const r = await fetch(url, {
    method: "POST",
    headers: { "Content-Type": "application/json", "Authorization": "Bearer " + cfg.key },
    body: JSON.stringify(body)
  });
  if (!r.ok) throw new Error("HTTP " + r.status);
  const data = await r.json();
  let txt = (data.choices && data.choices[0] && data.choices[0].message && data.choices[0].message.content) || "";
  txt = txt.trim().replace(/^```(?:json)?/i, "").replace(/```$/, "").trim();
  const a = txt.indexOf("["), b = txt.lastIndexOf("]");
  if (a >= 0 && b > a) txt = txt.slice(a, b + 1);
  let arr;
  try { arr = JSON.parse(txt); } catch (e) {
    // 退化：按行取
    arr = txt.split("\n").map(l => l.replace(/^\s*\d+[.、)\]]\s*/, "").replace(/^["'\[]|["'\],]?$/g, "").trim()).filter(Boolean);
  }
  if (!Array.isArray(arr)) throw new Error("返回格式不对");
  const out = {};
  arr.forEach((v, i) => { out[i] = v; });
  return out;
}

/* ========== 数据备份：分块校验，绝不覆盖已有记录 ========== */
const BACKUP_MAGIC = new TextEncoder().encode("JINGTING-BAK-1\n");
const BACKUP_CHUNK = 192 * 1024, BACKUP_MAX_META = 16 * 1024 * 1024;
let backupBusy = false, pendingBackup = null;
const backupCRCtable = (() => {
  const t = new Uint32Array(256);
  for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = (c >>> 1) ^ ((c & 1) ? 0xedb88320 : 0); t[n] = c >>> 0; }
  return t;
})();
function backupCRC(crc, bytes) { for (let i = 0; i < bytes.length; i++) crc = (crc >>> 8) ^ backupCRCtable[(crc ^ bytes[i]) & 255]; return crc >>> 0; }
function backupU32(n) { const b = new Uint8Array(4); new DataView(b.buffer).setUint32(0, n, true); return b; }
async function backupBlobCRC(crc, blob) {
  let chunks = 0;
  for (let p = 0; p < blob.size; p += BACKUP_CHUNK) {
    crc = backupCRC(crc, new Uint8Array(await blob.slice(p, p + BACKUP_CHUNK).arrayBuffer()));
    if (++chunks % 8 === 0) await new Promise(resolve => setTimeout(resolve, 0));
  }
  return crc;
}
async function makeBackup(records) {
  if (records.length > 100000) throw new Error("材料数量过多");
  const parts = [BACKUP_MAGIC, backupU32(records.length)];
  for (let i = 0; i < records.length; i++) {
    const { blob, ...meta } = records[i];
    if (!(blob instanceof Blob)) throw new Error("材料缺少音频：" + (meta.name || i + 1));
    const json = new TextEncoder().encode(JSON.stringify(meta));
    if (json.length > BACKUP_MAX_META) throw new Error("字幕内容过大");
    const head = new Uint8Array(12), view = new DataView(head.buffer);
    view.setUint32(0, json.length, true); view.setUint32(4, blob.size >>> 0, true); view.setUint32(8, Math.floor(blob.size / 4294967296), true);
    let crc = backupCRC(0xffffffff, head); crc = backupCRC(crc, json); crc = await backupBlobCRC(crc, blob);
    parts.push(head, json, blob, backupU32((crc ^ 0xffffffff) >>> 0));
    toast(`准备备份 ${i + 1}/${records.length}`, 20000);
  }
  parts.push(new TextEncoder().encode("END!"));
  return new Blob(parts, { type:"application/octet-stream" });
}
async function parseBackup(file) {
  let offset = 0;
  async function take(n) {
    if (!Number.isSafeInteger(n) || n < 0 || offset + n > file.size) throw new Error("备份文件不完整");
    const b = new Uint8Array(await file.slice(offset, offset + n).arrayBuffer()); offset += n; return b;
  }
  const magic = await take(BACKUP_MAGIC.length);
  if (!magic.every((b, i) => b === BACKUP_MAGIC[i])) throw new Error("不是精听备份文件");
  const countBytes = await take(4), count = new DataView(countBytes.buffer).getUint32(0, true);
  if (count > 100000) throw new Error("备份条目数量异常");
  const records = [], ids = new Set();
  for (let i = 0; i < count; i++) {
    const head = await take(12), view = new DataView(head.buffer);
    const metaSize = view.getUint32(0, true), size = view.getUint32(4, true) + view.getUint32(8, true) * 4294967296;
    if (metaSize > BACKUP_MAX_META || !Number.isSafeInteger(size) || offset + metaSize + size + 4 > file.size) throw new Error("备份内容长度异常");
    const json = await take(metaSize); let meta;
    try { meta = JSON.parse(new TextDecoder("utf-8", {fatal:true}).decode(json)); } catch (_) { throw new Error("备份资料格式错误"); }
    if (!meta || typeof meta !== "object" || typeof meta.id !== "string" || !meta.id || typeof meta.name !== "string" || ids.has(meta.id)) throw new Error("备份条目无效或重复");
    ids.add(meta.id);
    const blob = file.slice(offset, offset + size, typeof meta.mime === "string" ? meta.mime : "application/octet-stream"); offset += size;
    const stored = new DataView((await take(4)).buffer).getUint32(0, true);
    let crc = backupCRC(0xffffffff, head); crc = backupCRC(crc, json); crc = await backupBlobCRC(crc, blob);
    if (((crc ^ 0xffffffff) >>> 0) !== stored) throw new Error("备份校验失败：" + meta.name);
    records.push({ ...meta, blob }); toast(`检查备份 ${i + 1}/${count}`, 20000);
  }
  const end = new TextDecoder().decode(await take(4));
  if (end !== "END!" || offset !== file.size) throw new Error("备份结尾无效");
  return records;
}
async function restoreBackupRecords(records) {
  if (memMode || !db) throw new Error("本地存储不可用，无法安全恢复");
  const existing = new Set((await dbAll()).map(t => t.id));
  const fresh = records.filter(t => !existing.has(t.id));
  if (!fresh.length) return { restored:0, skipped:records.length };
  await new Promise((resolve, reject) => {
    const transaction = db.transaction(STORE, "readwrite"), store = transaction.objectStore(STORE);
    transaction.oncomplete = resolve;
    transaction.onabort = () => reject(transaction.error || new Error("恢复失败，原数据未更改"));
    transaction.onerror = () => {};
    try { for (const t of fresh) store.add(t); } catch (e) { transaction.abort(); }
  });
  return { restored:fresh.length, skipped:records.length - fresh.length };
}
function backupBase64(bytes) {
  let out = ""; for (let i = 0; i < bytes.length; i += 8192) out += String.fromCharCode(...bytes.subarray(i, i + 8192));
  return btoa(out);
}
/* 安卓保存时边读取边校验写入，避免先完整扫描再重复读取音频。 */
function prepareNativeBackup(records) {
  if (records.length > 100000) throw new Error("材料数量过多");
  let total = BACKUP_MAGIC.length + 8;
  const items = records.map((record, i) => {
    const { blob, ...meta } = record;
    if (!(blob instanceof Blob)) throw new Error("材料缺少音频：" + (meta.name || i + 1));
    const json = new TextEncoder().encode(JSON.stringify(meta));
    if (json.length > BACKUP_MAX_META) throw new Error("字幕内容过大");
    const head = new Uint8Array(12), view = new DataView(head.buffer);
    view.setUint32(0, json.length, true); view.setUint32(4, blob.size >>> 0, true); view.setUint32(8, Math.floor(blob.size / 4294967296), true);
    total += head.length + json.length + blob.size + 4;
    if (!Number.isSafeInteger(total)) throw new Error("备份文件过大");
    return {head, json, blob};
  });
  return {items, total};
}
async function streamNativeBackup(prepared, bridge, report) {
  let sent = 0, chunks = 0, lastReport = 0;
  async function send(bytes) {
    for (let p = 0; p < bytes.length; p += BACKUP_CHUNK) {
      const chunk = bytes.subarray(p, Math.min(bytes.length, p + BACKUP_CHUNK));
      if (!bridge.writeChunk(backupBase64(chunk))) throw new Error("备份写入失败");
      sent += chunk.length;
      const now = Date.now();
      if (now - lastReport >= 250) { report(Math.min(100, Math.floor(sent / prepared.total * 100))); lastReport = now; }
      if (++chunks % 8 === 0) await new Promise(resolve => setTimeout(resolve, 0));
    }
  }
  await send(BACKUP_MAGIC); await send(backupU32(prepared.items.length));
  for (const item of prepared.items) {
    await send(item.head); await send(item.json);
    let crc = backupCRC(0xffffffff, item.head); crc = backupCRC(crc, item.json);
    for (let p = 0; p < item.blob.size; p += BACKUP_CHUNK) {
      const bytes = new Uint8Array(await item.blob.slice(p, p + BACKUP_CHUNK).arrayBuffer());
      crc = backupCRC(crc, bytes); await send(bytes);
    }
    await send(backupU32((crc ^ 0xffffffff) >>> 0));
  }
  await send(new TextEncoder().encode("END!"));
}
window.jingtingBackupChosen = async ready => {
  if (!pendingBackup) return;
  const prepared = pendingBackup; pendingBackup = null;
  if (!ready) { backupBusy = false; toast("已取消或无法创建备份"); return; }
  try {
    await streamNativeBackup(prepared, window.JingtingBackup, pct => toast(`保存备份 ${pct}%`, 20000));
    if (!window.JingtingBackup.finish()) throw new Error("无法完成备份文件");
    toast("备份已保存，请保管好备份文件", 3500);
  } catch (e) { window.JingtingBackup.abort(); toast("备份失败：" + e.message, 5000); }
  finally { backupBusy = false; }
};
$("#btnBackup").onclick = async () => {
  if (backupBusy) { toast("备份或恢复正在进行"); return; }
  if (memMode || !db) { toast("本地存储不可用，无法安全备份"); return; }
  backupBusy = true;
  try {
    const records = await dbAll();
    if (window.JingtingBackup) { pendingBackup = prepareNativeBackup(records); window.JingtingBackup.pickSave(); return; }
    const blob = await makeBackup(records);
    const url = URL.createObjectURL(blob), a = document.createElement("a");
    a.href = url; a.download = "精听备份.jtbak"; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 60000); backupBusy = false; toast("备份已生成，请确认浏览器保存成功", 3500);
  } catch (e) { backupBusy = false; pendingBackup = null; toast("备份失败：" + e.message, 5000); }
};
const backupInput = document.createElement("input"); backupInput.type = "file"; backupInput.accept = ".jtbak,application/octet-stream"; backupInput.style.display = "none"; document.body.appendChild(backupInput);
$("#btnRestore").onclick = () => { if (backupBusy) { toast("备份或恢复正在进行"); return; } backupInput.value = ""; backupInput.click(); };
backupInput.onchange = async () => {
  const file = backupInput.files && backupInput.files[0]; backupInput.value = ""; if (!file || backupBusy) return;
  backupBusy = true;
  try {
    const records = await parseBackup(file), current = new Set((await dbAll()).map(t => t.id));
    const duplicates = records.filter(t => current.has(t.id)).length;
    if (!await confirmAction({ title:"恢复备份", message:`备份共 ${records.length} 条材料，${duplicates} 条已存在将跳过。将恢复其余 ${records.length - duplicates} 条。`, action:"开始恢复" })) return;
    const result = await restoreBackupRecords(records); await renderLib();
    toast(`恢复 ${result.restored} 条，跳过 ${result.skipped} 条`, 5000);
  } catch (e) { toast("恢复失败：" + (e.message || "请检查备份"), 6000); }
  finally { backupBusy = false; }
};

/* ========== 设置页 ========== */
function fillSet() {
  $("#cfgBase").value = cfg.base;
  $("#cfgKey").value = cfg.key;
  $("#cfgModel").value = cfg.model;
  $("#cfgFont").value = cfg.font;
  $("#cfgRefresh").value = cfg.refreshMode==='smooth'?'smooth':'system';
}
$("#cfgRefresh").onchange = e => {cfg.refreshMode=e.target.value;saveCfg();applyRefreshPreference();};
$("#cfgBase").onchange = e => { cfg.base = e.target.value.trim(); saveCfg(); };
$("#cfgKey").onchange = e => { cfg.key = e.target.value.trim(); saveCfg(); };
$("#cfgModel").onchange = e => { cfg.model = e.target.value.trim(); saveCfg(); };
$("#cfgFont").onchange = e => {
  const v = Math.max(13, Math.min(26, +e.target.value || 16));
  cfg.font = v; e.target.value = v; saveCfg();
  document.documentElement.style.setProperty("--fs", v + "px");
};
$("#btnClear").onclick = async () => {
  if (!await confirmAction({ title:"清空全部材料？", message:"全部音频、字幕、译文和播放进度将被删除，无法撤销。建议先导出备份。", action:"清空全部材料", destructive:true })) return;
  try { await dbClear(); releaseCurrentTrack(); settingsReturnView = "vLib"; await renderLib(); toast("已清空"); }
  catch (e) { toast("清空失败，请重试"); }
};

/* ========== 启动 ========== */
(async function init() {
  $("#btnSpd").textContent = "1.0×";
  try { await openDB(); } catch (e) { memMode = true; }
  await renderLib();
  if (memMode) toast("当前环境禁用了本地存储，导入内容关闭页面后会丢失", 4200);
  document.documentElement.style.setProperty("--fs", cfg.font + "px");
  applyRefreshPreference();
  // 恢复上次打开的
  // 阻止双击缩放
  document.addEventListener("dblclick", e => e.preventDefault(), { passive: false });
})();
